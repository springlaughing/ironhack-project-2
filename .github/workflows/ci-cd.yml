# #8: the pipeline for the voting app.
#   Pull request to main: build the three images, no push, no deploy,
#     so a broken Dockerfile shows up before the merge.
#   Push to main (= a merge): build, push to Docker Hub tagged with the commit ID,
#     then deploy to EKS as the OIDC role gha-voting-deploy-evgenia (#7).
# No AWS keys stored anywhere; the only stored secret is DOCKERHUB_TOKEN.
name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # deploy main again by hand, e.g. after a morning rebuild

permissions:
  contents: read
  id-token: write      # the deploy job's OIDC login

concurrency:
  group: ci-cd-${{ github.ref }}   # one run per branch at a time
  cancel-in-progress: false        # never stop a deploy half-way

env:
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_USERNAME }}/voting   # springlaughing/voting-<app>

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [vote, result, worker]
    steps:
      - uses: actions/checkout@v7

      - name: Image tag = short commit ID
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push, except on pull requests)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      NS: ${{ vars.K8S_NAMESPACE }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Database Secret from Secrets Manager (never printed)
        run: |
          PG=$(aws secretsmanager get-secret-value --secret-id voting/db-password \
            --query SecretString --output text)
          echo "::add-mask::$PG"
          kubectl create secret generic db-credentials -n "$NS" \
            --from-literal=username=postgres --from-literal=password="$PG" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Point the manifests at this commit's images
        run: |
          TAG="${GITHUB_SHA::7}"
          for app in vote result worker; do
            sed -i -E "s#(image: ${IMAGE_PREFIX}-${app}):[^ ]+#\1:${TAG}#" "k8s/app/${app}.yaml"
          done
          grep -n "image: ${IMAGE_PREFIX}" k8s/app/*.yaml

      - name: Apply k8s/app/
        run: kubectl apply -f k8s/app/

      - name: Wait for the new pods
        run: |
          kubectl rollout status statefulset/worker -n "$NS" --timeout=5m
          kubectl rollout status deployment/vote    -n "$NS" --timeout=5m
          kubectl rollout status deployment/result  -n "$NS" --timeout=5m

      - name: Smoke test (pages through the Gateway, one vote into PostgreSQL)
        run: ./smoke-test.sh
