# gp3 EBS volumes for PersistentVolumeClaims, created by the EBS CSI driver
# (Pod Identity role ebs-csi-evgenia, the one that broke on 22 Oct).
# Cluster-wide, so platform: applied by setup-cluster.sh as admin.
# Only needed if `kubectl get storageclass` shows no "(default)".
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"  # PVCs without a class get this one
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"                       # encrypted at rest with the AWS-managed EBS key
volumeBindingMode: WaitForFirstConsumer   # make the disk only once the pod is placed, in that pod's zone
reclaimPolicy: Delete                     # deleting the PVC deletes the EBS volume: no leftovers after teardown
allowVolumeExpansion: true