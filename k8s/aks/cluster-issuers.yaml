# Let's Encrypt on AKS: HTTP-01 instead of DNS-01.
# Let's Encrypt fetches http://vote.aks.springlaughing.dev/.well-known/acme-challenge/<token>;
# cert-manager answers it with a temporary HTTPRoute on our Gateway's port 80 listener.
# Needs no Azure permissions (on EKS, DNS-01 needed a Pod Identity role for Route 53).
# Limits: no wildcard certificates, and port 80 must be reachable from the internet.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-gateway
                namespace: voting-app
                kind: Gateway
                sectionName: http        # the port 80 listener
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-gateway
                namespace: voting-app
                kind: Gateway
                sectionName: http